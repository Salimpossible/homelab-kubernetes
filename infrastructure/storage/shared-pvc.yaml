apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  namespace: media
  annotations:
    description: >-
      Shared SMB library and downloads workspace (downloads/, movies/, tv/,
      sports/ as subPaths) mounted by Plex, Jellyfin, Radarr, Sonarr,
      Sportarr, and qBittorrent
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: smb-media
  resources:
    requests:
      storage: 3Ti