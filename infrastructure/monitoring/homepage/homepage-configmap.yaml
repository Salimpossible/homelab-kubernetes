apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: monitoring
  labels:
    app.kubernetes.io/name: homepage
data:
  # Tell Homepage to run in-cluster and read ingresses
  kubernetes.yaml: |
    mode: cluster
    ingress: true
    labelSelector: app
    # traefik: true   # enable if you also use Traefik IngressRoute
    # gateway: true   # enable if you use Gateway API
  settings.yaml: ""
  custom.css: ""
  custom.js: ""
  # You can keep these minimal and rely mostly on automatic discovery
  bookmarks.yaml: |
    - Dev:
        - K8s Dashboard:
            href: https://kubernetes-dashboard.home.arpa/
  services.yaml: |
    - Cluster:
        - Homepage:
            href: https://homepage.home.arpa/
            description: Main homelab dashboard
    - Media:
        - Plex:
            href: https://plex.home.arpa/
            namespace: media
            app: plex
        - Jellyfin:
            href: https://jellyfin.home.arpa/
            namespace: media
            app: jellyfin
        - qBittorrent (Gluetun VPN):
            href: https://qbittorrent.home.arpa/
            description: Status reflects the whole pod, including the Gluetun VPN sidecar
            namespace: media
            app: vpn-torrent
    - Arr Stack:
        - Radarr:
            href: https://radarr.home.arpa/
            namespace: media
            app: radarr
        - Sonarr:
            href: https://sonarr.home.arpa/
            namespace: media
            app: sonarr
        - Prowlarr:
            href: https://prowlarr.home.arpa/
            namespace: media
            app: prowlarr
        - Sportarr:
            href: https://sportarr.home.arpa/
            namespace: media
            app: sportarr
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""